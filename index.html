<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سبورة Hanna</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceaf7;--pn:#fff;--tx:#1f2a44;--mt:#6b7391;--ac:#7c3aed;--ac2:#f59e0b;--bd:#ddd8f0;--sh:0 8px 30px rgba(60,40,120,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1022;--pn:#1a1f3a;--tx:#eef0ff;--mt:#9aa3cf;--bd:#2c3360;--sh:0 8px 30px rgba(0,0,0,.55)}}
:root[data-theme="dark"]{--bg:#0d1022;--pn:#1a1f3a;--tx:#eef0ff;--mt:#9aa3cf;--bd:#2c3360;--sh:0 8px 30px rgba(0,0,0,.55)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
header{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:19px}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--ac),#ec4899 60%,var(--ac2));display:grid;place-items:center;color:#fff;font-size:18px;box-shadow:0 4px 14px rgba(124,58,237,.45)}
.brand b{background:linear-gradient(90deg,var(--ac),#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
#st{font-size:12px;color:var(--mt);padding:2px 9px;border-radius:99px;border:1px solid var(--bd)}
#st.ok{color:#16a34a}#st.err{color:#dc2626}
.sp{flex:1}
button,select{font-family:inherit;color:var(--tx)}
.b{background:var(--bg);border:1px solid var(--bd);border-radius:10px;min-width:38px;height:38px;padding:0 10px;cursor:pointer;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:.15s}
.b:hover{border-color:var(--ac);transform:translateY(-1px)}
.b.on{background:var(--ac);color:#fff;border-color:var(--ac);box-shadow:0 4px 14px rgba(124,58,237,.45)}
.b.gold{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#3b2300;border:0;font-weight:700;font-size:14px}
.b:disabled{opacity:.4;cursor:default;transform:none}
.pg{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700}
#wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
#stage{position:relative;border-radius:14px;overflow:hidden;box-shadow:var(--sh);background:#fff}
#stage canvas{position:absolute;inset:0;width:100%;height:100%}
#dr{touch-action:none;cursor:crosshair}
.ti{position:absolute;background:rgba(255,255,255,.85);border:2px dashed var(--ac);border-radius:6px;outline:0;min-width:140px;font-family:Cairo,sans-serif;font-weight:700;padding:0 6px;z-index:5;user-select:text;-webkit-user-select:text}
#las{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(#fff 0 20%,#ef4444 40%,rgba(239,68,68,0) 72%);pointer-events:none;display:none;z-index:4}
#tools{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--pn);border-top:1px solid var(--bd);overflow-x:auto;white-space:nowrap}
.grp{display:flex;align-items:center;gap:5px;padding-inline-end:10px;border-inline-end:1px solid var(--bd)}
.grp:last-child{border:0}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);cursor:pointer;padding:0}
.sw.on{outline:3px solid var(--ac);outline-offset:1px}
input[type=range]{width:90px;accent-color:var(--ac)}
input[type=color]{width:30px;height:30px;border:0;background:none;padding:0;cursor:pointer}
select{background:var(--bg);border:1px solid var(--bd);border-radius:10px;height:38px;padding:0 8px}
.lb{font-size:12px;color:var(--mt)}
#pop{position:fixed;top:calc(62px + env(safe-area-inset-top,0px));inset-inline-start:12px;background:var(--pn);border:1px solid var(--bd);border-radius:16px;padding:12px;box-shadow:var(--sh);z-index:50;width:min(340px,92vw);display:none}
#pop.show{display:block}
#pop h4{font-size:13px;margin:8px 0 6px;color:var(--mt)}
.fxg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fxg .b{flex-direction:column;height:60px;font-size:24px}
.fxg small{font-size:11px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bd);background:var(--bg);border-radius:99px;padding:5px 11px;cursor:pointer;font-size:13px}
.chip:hover{background:var(--ac);color:#fff}
#emo{display:none;position:fixed;bottom:76px;inset-inline-start:50%;transform:translateX(50%);background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:8px;box-shadow:var(--sh);z-index:50;max-width:92vw;flex-wrap:wrap;gap:4px;justify-content:center;width:320px}
#emo.show{display:flex}
#emo button{font-size:24px;background:none;border:0;cursor:pointer;border-radius:8px;padding:2px 5px}
#emo button:hover{background:var(--bg)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
#ban{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%) scale(0);z-index:80;pointer-events:none;font-size:clamp(28px,7vw,64px);font-weight:900;color:#fff;padding:14px 34px;border-radius:28px;background:linear-gradient(135deg,#7c3aed,#ec4899,#f59e0b);box-shadow:0 20px 60px rgba(124,58,237,.6);text-align:center;white-space:nowrap}
#ban.show{animation:pop 2.2s ease forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0) rotate(-8deg)}15%{transform:translate(-50%,-50%) scale(1.15) rotate(3deg)}25%{transform:translate(-50%,-50%) scale(1)}80%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(.8);opacity:0}}
.fl{position:fixed;z-index:60;pointer-events:none}
.fl.up{bottom:-70px;animation:up linear forwards}.fl.dn{top:-70px;animation:dn linear forwards}
@keyframes up{to{transform:translateY(-120vh) rotate(25deg)}}
@keyframes dn{to{transform:translateY(120vh) rotate(360deg)}}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#1f2a44;color:#fff;padding:9px 18px;border-radius:99px;font-size:14px;z-index:90;opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:95}
#flash.go{animation:fl .4s ease}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
#modal{position:fixed;inset:0;background:rgba(10,10,30,.7);display:none;place-items:center;z-index:100;padding:16px}
#modal.show{display:grid}
#modal div{background:var(--pn);border-radius:16px;padding:14px;max-width:min(860px,96vw);text-align:center}
#modal img{max-width:100%;max-height:68vh;border-radius:10px;border:1px solid var(--bd);-webkit-user-select:auto;user-select:auto}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">✿</div><span>سبورة <b>Hanna</b></span></div>
  <span id="st" class="ok">محفوظ ✓</span>
  <div class="sp"></div>
  <button class="b" id="undo" title="تراجع (Ctrl+Z)">↶</button>
  <button class="b" id="redo" title="إعادة (Ctrl+Y)">↷</button>
  <div class="pg">
    <button class="b" id="prev" title="الصفحة السابقة">›</button>
    <span id="pl">1 / 1</span>
    <button class="b" id="next" title="الصفحة التالية">‹</button>
    <button class="b" id="addp" title="صفحة جديدة">＋</button>
    <button class="b" id="delp" title="حذف الصفحة">🗑</button>
  </div>
  <button class="b gold" id="fxb">🎉 تشجيع</button>
  <button class="b" id="shot" title="لقطة شاشة (يُحفظ ويُنسخ)">📸 لقطة</button>
  <button class="b" id="sav" title="حفظ ملف احتياطي">💾</button>
  <button class="b" id="opn" title="فتح ملف محفوظ">📂</button>
  <button class="b" id="clr" title="مسح الصفحة">🧹</button>
  <button class="b" id="thm" title="الوضع الليلي / النهاري">🌓</button>
  <button class="b" id="fs" title="ملء الشاشة">⛶</button>
  <input type="file" id="file" accept=".json,application/json" hidden>
</header>

<div id="pop">
  <div class="fxg">
    <button class="b" data-fx="clap">👏<small>تصفيق</small></button>
    <button class="b" data-fx="party">🎉<small>احتفال</small></button>
    <button class="b" data-fx="balloon">🎈<small>بالونات</small></button>
    <button class="b" data-fx="star">⭐<small>نجوم</small></button>
  </div>
  <h4>عبارات تشجيع</h4>
  <div class="chips" id="chips"></div>
  <h4>الصوت</h4>
  <button class="b" id="snd">🔊 الصوت يعمل</button>
</div>

<div id="wrap">
  <div id="stage">
    <canvas id="bg"></canvas>
    <canvas id="dr"></canvas>
    <div id="las"></div>
  </div>
</div>

<div id="emo"></div>

<div id="tools">
  <div class="grp" id="tl"></div>
  <div class="grp" id="cl"></div>
  <div class="grp">
    <span class="lb">السُّمك</span><input type="range" id="sz" min="1" max="40" value="6">
    <span class="lb">الشفافية</span><input type="range" id="op" min="10" max="100" value="100">
  </div>
  <div class="grp">
    <button class="b" id="fill" title="تعبئة الأشكال">▣ تعبئة</button>
    <select id="bgs" title="خلفية الصفحة">
      <option value="white">أبيض</option><option value="cream">كريمي</option><option value="green">سبورة خضراء</option><option value="navy">سبورة زرقاء</option><option value="black">أسود</option><option value="grid">مربعات</option><option value="lines">مسطّر</option><option value="dots">نقاط</option>
    </select>
  </div>
</div>

<canvas id="fx"></canvas>
<div id="ban"></div>
<div id="toast"></div>
<div id="flash"></div>
<div id="modal"><div><img id="mi" alt="لقطة السبورة"><p class="lb" style="margin:8px 0">اضغط مطولًا (أو بزر الفأرة الأيمن) على الصورة لحفظها</p><button class="b" id="mc">إغلاق</button></div></div>

<script>
(function(){
"use strict";
var W=1600,H=900,KEY="hanna_board_v1";
function $(s){return document.querySelector(s)}
var stage=$("#stage"),bgc=$("#bg"),dc=$("#dr"),bx=bgc.getContext("2d"),dx=dc.getContext("2d");
bgc.width=dc.width=W;bgc.height=dc.height=H;
var S={pages:[{s:[],r:[],bg:"white"}],cur:0,color:"#1f2a44",size:6,alpha:1,tool:"pen",emoji:"⭐",fill:false,snd:true,theme:""};
var BG={white:["#ffffff"],cream:["#fdf6e3"],black:["#111111"],green:["#14532d"],navy:["#0f172a"],grid:["#ffffff","grid"],lines:["#ffffff","lines"],dots:["#ffffff","dots"]};
var TOOLS=[["pen","✏️","قلم (P)"],["hl","🖍️","هايلايتر (H)"],["erase","🧽","ممحاة (E)"],["line","╱","خط (L)"],["arrow","➜","سهم (A)"],["rect","▭","مستطيل (R)"],["ell","◯","دائرة / بيضاوي (O)"],["tri","△","مثلث"],["text","T","نص (T)"],["emo","⭐","ستيكر / إيموجي"],["laser","🔴","ليزر (K)"]];
var COLORS=["#1f2a44","#ef4444","#f97316","#eab308","#22c55e","#06b6d4","#3b82f6","#a855f7","#ec4899","#ffffff"];
var EMOJIS="⭐🌟✨💯✅❌👍👏🏆🥇🎯💡❤️😊😍🤩🎈🎉🌈🌸🦋🐱🐶🦁📚✏️🔥🚀🍎".match(/\p{Extended_Pictographic}(\uFE0F)?/gu)||["⭐"];
function pg(){return S.pages[S.cur]}

/* ---------- drawing ---------- */
function drawBg(){
  var b=BG[pg().bg]||BG.white,p=b[1],x;
  bx.fillStyle=b[0];bx.fillRect(0,0,W,H);
  bx.strokeStyle="rgba(110,130,170,.35)";bx.fillStyle="rgba(110,130,170,.55)";bx.lineWidth=1;
  if(p==="grid"){bx.beginPath();for(x=0;x<=W;x+=50){bx.moveTo(x,0);bx.lineTo(x,H)}for(x=0;x<=H;x+=50){bx.moveTo(0,x);bx.lineTo(W,x)}bx.stroke()}
  if(p==="lines"){bx.beginPath();for(x=70;x<=H;x+=60){bx.moveTo(0,x);bx.lineTo(W,x)}bx.stroke()}
  if(p==="dots"){for(var i=40;i<W;i+=40)for(var j=40;j<H;j+=40){bx.beginPath();bx.arc(i,j,2,0,6.283);bx.fill()}}
}
function path(c,p){
  c.beginPath();c.moveTo(p[0][0],p[0][1]);
  if(p.length<3){for(var i=0;i<p.length;i++)c.lineTo(p[i][0],p[i][1])}
  else{for(var k=1;k<p.length-1;k++)c.quadraticCurveTo(p[k][0],p[k][1],(p[k][0]+p[k+1][0])/2,(p[k][1]+p[k+1][1])/2);c.lineTo(p[p.length-1][0],p[p.length-1][1])}
  c.stroke();
}
function drawItem(c,i){
  c.save();c.globalAlpha=i.a==null?1:i.a;c.strokeStyle=c.fillStyle=i.c||"#000";c.lineWidth=i.w;c.lineCap=c.lineJoin="round";
  if(i.t==="erase")c.globalCompositeOperation="destination-out";
  if(i.t==="hl")c.lineCap="butt";
  if(i.t==="pen"||i.t==="hl"||i.t==="erase"){path(c,i.p)}
  else if(i.t==="text"){c.font="700 "+i.w+"px Cairo,Tahoma,sans-serif";c.textBaseline="top";c.textAlign="left";c.direction=/[\u0600-\u06FF]/.test(i.s)?"rtl":"ltr";c.fillText(i.s,i.x,i.y)}
  else if(i.t==="emo"){c.font=i.w+"px 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif";c.textAlign="center";c.textBaseline="middle";c.fillText(i.s,i.x,i.y)}
  else{
    var x1=i.x1,y1=i.y1,x2=i.x2,y2=i.y2;
    if(i.t==="line"||i.t==="arrow"){
      c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();
      if(i.t==="arrow"){var an=Math.atan2(y2-y1,x2-x1),h=Math.max(16,i.w*3.5);c.beginPath();c.moveTo(x2-h*Math.cos(an-.45),y2-h*Math.sin(an-.45));c.lineTo(x2,y2);c.lineTo(x2-h*Math.cos(an+.45),y2-h*Math.sin(an+.45));c.stroke()}
    }else{
      c.beginPath();
      if(i.t==="rect")c.rect(x1,y1,x2-x1,y2-y1);
      else if(i.t==="ell")c.ellipse((x1+x2)/2,(y1+y2)/2,Math.abs(x2-x1)/2,Math.abs(y2-y1)/2,0,0,6.283);
      else{c.moveTo((x1+x2)/2,y1);c.lineTo(x2,y2);c.lineTo(x1,y2);c.closePath()}
      if(i.f){c.globalAlpha=(i.a==null?1:i.a)*.3;c.fill();c.globalAlpha=i.a==null?1:i.a}
      c.stroke();
    }
  }
  c.restore();
}
function redraw(){dx.clearRect(0,0,W,H);pg().s.forEach(function(i){drawItem(dx,i)})}
function refresh(){drawBg();redraw();label()}
function label(){
  $("#pl").textContent=(S.cur+1)+" / "+S.pages.length;
  $("#prev").disabled=S.cur===0;$("#next").disabled=S.cur===S.pages.length-1;
  $("#delp").disabled=S.pages.length===1;
  $("#undo").disabled=!pg().s.length;$("#redo").disabled=!pg().r.length;
  $("#bgs").value=pg().bg;
}
function add(i){pg().s.push(i);pg().r=[];redraw();label();save()}

/* ---------- pointer ---------- */
var cur=null,las=$("#las");
function pt(e){var r=dc.getBoundingClientRect();return[Math.round((e.clientX-r.left)*W/r.width),Math.round((e.clientY-r.top)*H/r.height)]}
dc.addEventListener("pointerdown",function(e){
  if(e.button>0)return;e.preventDefault();
  var p=pt(e),t=S.tool;
  if(t==="text"){textAt(p[0],p[1]);return}
  if(t==="emo"){add({t:"emo",s:S.emoji,x:p[0],y:p[1],w:Math.max(64,S.size*10),a:S.alpha});sfx("pop");return}
  if(t==="laser"){moveLaser(e);return}
  try{dc.setPointerCapture(e.pointerId)}catch(x){}
  if(t==="pen")cur={t:"pen",c:S.color,w:S.size,a:S.alpha,p:[p]};
  else if(t==="hl")cur={t:"hl",c:S.color,w:S.size*3,a:Math.min(S.alpha,.4),p:[p]};
  else if(t==="erase")cur={t:"erase",c:"#000",w:S.size*4,a:1,p:[p]};
  else cur={t:t,c:S.color,w:S.size,a:S.alpha,f:S.fill,x1:p[0],y1:p[1],x2:p[0],y2:p[1]};
  if(cur.p){if(inc()){drawItem(dx,{t:cur.t,c:cur.c,w:cur.w,a:cur.a,p:[p,p]})}else{redraw();drawItem(dx,cur)}}
});
function inc(){return cur.t==="erase"||(cur.t==="pen"&&cur.a===1)}
dc.addEventListener("pointermove",function(e){
  if(S.tool==="laser"){moveLaser(e);return}
  if(!cur)return;
  var evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];if(!evs.length)evs=[e];
  evs.forEach(function(ev){
    var p=pt(ev);
    if(cur.p){var l=cur.p[cur.p.length-1];if(Math.abs(p[0]-l[0])+Math.abs(p[1]-l[1])<2)return;cur.p.push(p);if(inc())drawItem(dx,{t:cur.t,c:cur.c,w:cur.w,a:cur.a,p:[l,p]})}
    else{cur.x2=p[0];cur.y2=p[1]}
  });
  if(!inc()){redraw();drawItem(dx,cur)}
});
function end(){
  if(!cur)return;var c=cur;cur=null;
  if(!c.p&&Math.abs(c.x2-c.x1)+Math.abs(c.y2-c.y1)<4){redraw();return}
  if(c.p&&c.t==="hl"&&c.p.length<2){redraw();return}
  add(c);
}
dc.addEventListener("pointerup",end);dc.addEventListener("pointercancel",end);
dc.addEventListener("pointerleave",function(){las.style.display="none"});
function moveLaser(e){var r=stage.getBoundingClientRect();las.style.display="block";las.style.left=(e.clientX-r.left)+"px";las.style.top=(e.clientY-r.top)+"px"}
function textAt(x,y){
  var k=dc.getBoundingClientRect().width/W,fs=Math.max(20,S.size*5+16),i=document.createElement("input"),done=false;
  i.className="ti";i.dir="auto";i.placeholder="اكتب هنا...";
  i.style.cssText="left:"+(x/W*100)+"%;top:"+(y/H*100)+"%;font-size:"+(fs*k)+"px;color:"+S.color+";height:"+(fs*k*1.4)+"px";
  stage.appendChild(i);setTimeout(function(){i.focus()},0);
  function fin(ok){if(done)return;done=true;var v=i.value.trim();i.remove();if(ok&&v)add({t:"text",c:S.color,a:S.alpha,w:fs,x:x,y:y,s:v})}
  i.onkeydown=function(e){if(e.key==="Enter")fin(true);if(e.key==="Escape")fin(false);e.stopPropagation()};
  i.onblur=function(){fin(true)};
}

/* ---------- history / pages ---------- */
function undo(){var p=pg();if(p.s.length){p.r.push(p.s.pop());redraw();label();save()}}
function redo(){var p=pg();if(p.r.length){p.s.push(p.r.pop());redraw();label();save()}}
function go(n){if(n<0||n>=S.pages.length)return;S.cur=n;refresh();save()}
var armed={};
function arm(id,msg,fn){if(armed[id]){clearTimeout(armed[id]);armed[id]=0;fn();return}toast(msg);armed[id]=setTimeout(function(){armed[id]=0},2500)}
$("#undo").onclick=undo;$("#redo").onclick=redo;
$("#prev").onclick=function(){go(S.cur-1)};$("#next").onclick=function(){go(S.cur+1)};
$("#addp").onclick=function(){S.pages.splice(S.cur+1,0,{s:[],r:[],bg:pg().bg});go(S.cur+1);toast("صفحة جديدة ✨")};
$("#delp").onclick=function(){arm("dp","اضغط مرة أخرى لحذف الصفحة",function(){S.pages.splice(S.cur,1);S.cur=Math.min(S.cur,S.pages.length-1);refresh();save()})};
$("#clr").onclick=function(){arm("cl","اضغط مرة أخرى لمسح الصفحة",function(){pg().s=[];pg().r=[];redraw();label();save()})};
$("#bgs").onchange=function(e){pg().bg=e.target.value;drawBg();autoInk();save()};
function lum(h){var n=parseInt(h.slice(1),16);return(.299*(n>>16)+.587*((n>>8)&255)+.114*(n&255))}
function autoInk(){
  var dark=["black","green","navy"].indexOf(pg().bg)>-1;
  if(dark&&lum(S.color)<90)setColor("#ffffff");
  else if(!dark&&lum(S.color)>235)setColor("#1f2a44");
}

/* ---------- UI build ---------- */
var tl=$("#tl"),cl=$("#cl");
TOOLS.forEach(function(t){var b=document.createElement("button");b.className="b";b.dataset.t=t[0];b.title=t[2];b.textContent=t[1];b.onclick=function(){setTool(t[0])};tl.appendChild(b)});
function setTool(t){
  S.tool=t;
  [].forEach.call(tl.children,function(b){b.classList.toggle("on",b.dataset.t===t)});
  dc.style.cursor=t==="text"?"text":t==="laser"?"none":"crosshair";
  if(t!=="laser")las.style.display="none";
  $("#emo").classList.toggle("show",t==="emo");
  save(true);
}
COLORS.forEach(function(c){var b=document.createElement("button");b.className="sw";b.dataset.c=c;b.style.background=c;b.title=c;b.onclick=function(){setColor(c)};cl.appendChild(b)});
var ci=document.createElement("input");ci.type="color";ci.value="#1f2a44";ci.title="لون مخصص";ci.oninput=function(){setColor(ci.value)};cl.appendChild(ci);
function setColor(c){
  S.color=c;ci.value=/^#[0-9a-f]{6}$/i.test(c)?c:"#1f2a44";
  [].forEach.call(cl.querySelectorAll(".sw"),function(b){b.classList.toggle("on",b.dataset.c===c)});
  if(S.tool==="erase"||S.tool==="laser"||S.tool==="emo")setTool("pen");
}
var em=$("#emo");
EMOJIS.forEach(function(x){var b=document.createElement("button");b.textContent=x;b.onclick=function(){S.emoji=x;em.classList.remove("show");toast("اضغط على السبورة لوضع "+x)};em.appendChild(b)});
$("#sz").oninput=function(e){S.size=+e.target.value;save(true)};
$("#op").oninput=function(e){S.alpha=+e.target.value/100;save(true)};
$("#fill").onclick=function(){S.fill=!S.fill;$("#fill").classList.toggle("on",S.fill)};
$("#thm").onclick=function(){
  var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  S.theme=dark?"light":"dark";r.dataset.theme=S.theme;save(true);
};
$("#fs").onclick=function(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()}catch(e){toast("ملء الشاشة غير متاح هنا")}};

/* ---------- storage ---------- */
var st,stEl=$("#st");
function stat(k){stEl.className=k;stEl.textContent=k==="ok"?"محفوظ ✓":k==="err"?"تعذّر الحفظ ⚠":"جارٍ الحفظ…"}
function pack(){return{v:1,pages:S.pages.map(function(p){return{s:p.s,bg:p.bg}}),cur:S.cur,color:S.color,size:S.size,alpha:S.alpha,tool:S.tool,snd:S.snd,theme:S.theme,emoji:S.emoji}}
function flush(){try{localStorage.setItem(KEY,JSON.stringify(pack()));stat("ok")}catch(e){stat("err")}}
function save(quick){stat("saving");clearTimeout(st);st=setTimeout(flush,quick?150:350)}
function apply(d){
  if(!d||!Array.isArray(d.pages)||!d.pages.length)return false;
  S.pages=d.pages.map(function(p){return{s:Array.isArray(p.s)?p.s:[],r:[],bg:BG[p.bg]?p.bg:"white"}});
  S.cur=Math.min(Math.max(+d.cur||0,0),S.pages.length-1);
  if(typeof d.color==="string"&&/^#[0-9a-f]{6}$/i.test(d.color))S.color=d.color;
  S.size=Math.min(40,Math.max(1,+d.size||6));S.alpha=Math.min(1,Math.max(.1,+d.alpha||1));
  S.snd=d.snd!==false;S.theme=d.theme||"";if(typeof d.emoji==="string")S.emoji=d.emoji;
  if(TOOLS.some(function(t){return t[0]===d.tool}))S.tool=d.tool;
  return true;
}
window.addEventListener("pagehide",flush);
document.addEventListener("visibilitychange",function(){if(document.hidden)flush()});

/* ---------- downloads / screenshot ---------- */
function dl(){try{return Promise.resolve(window.claude&&window.claude.use?window.claude.use("downloads"):null).catch(function(){return null})}catch(e){return Promise.resolve(null)}}
function stamp(){var d=new Date(),z=function(n){return(n<10?"0":"")+n};return d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+"-"+z(d.getHours())+z(d.getMinutes())+z(d.getSeconds())}
function snapCanvas(){var c=document.createElement("canvas");c.width=W;c.height=H;var x=c.getContext("2d");x.drawImage(bgc,0,0);x.drawImage(dc,0,0);return c}
function saveFile(name,data,okMsg,fallback){
  dl().then(function(d){
    if(!d){if(fallback)fallback();else toast("الحفظ غير متاح في هذا العرض");return}
    d.save({filename:name,data:data}).then(function(){toast(okMsg)},function(e){if(e&&e.code==="declined")toast("تم إلغاء الحفظ");else if(fallback)fallback();else toast("تعذّر الحفظ")});
  });
}
$("#shot").onclick=function(){
  $("#flash").classList.remove("go");void $("#flash").offsetWidth;$("#flash").classList.add("go");sfx("shot");
  var c=snapCanvas();
  c.toBlob(function(b){
    if(!b){toast("تعذّر إنشاء اللقطة");return}
    try{if(navigator.clipboard&&window.ClipboardItem)navigator.clipboard.write([new ClipboardItem({"image/png":b})]).catch(function(){})}catch(e){}
    saveFile("Hanna-"+stamp()+".png",b,"تم حفظ اللقطة 📸",function(){$("#mi").src=c.toDataURL("image/png");$("#modal").classList.add("show")});
  },"image/png");
};
$("#mc").onclick=function(){$("#modal").classList.remove("show")};
$("#modal").onclick=function(e){if(e.target.id==="modal")$("#modal").classList.remove("show")};
$("#sav").onclick=function(){saveFile("Hanna-board-"+stamp()+".json",JSON.stringify(pack()),"تم حفظ ملف السبورة 💾")};
$("#opn").onclick=function(){$("#file").click()};
$("#file").onchange=function(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var d=JSON.parse(r.result);if(!apply(d))throw 0;initUI();refresh();save(true);toast("تم فتح السبورة ✓")}catch(x){toast("الملف غير صالح")}};
  r.onerror=function(){toast("تعذّرت قراءة الملف")};
  r.readAsText(f);e.target.value="";
};

/* ---------- sound ---------- */
var AC;
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}return S.snd?AC:null}
function tone(f,t,d,v,ty){var a=ac();if(!a)return;var o=a.createOscillator(),g=a.createGain(),n=a.currentTime+t;o.type=ty||"sine";o.frequency.value=f;g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v||.2,n+.02);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(a.destination);o.start(n);o.stop(n+d+.05)}
function sfx(k){
  var a=ac();if(!a)return;
  if(k==="clap"){
    var n=a.sampleRate*2,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0),i;for(i=0;i<n;i++)d[i]=Math.random()*2-1;
    for(i=0;i<30;i++){var t=a.currentTime+Math.random()*1.7,s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type="bandpass";f.frequency.value=1200+Math.random()*2600;f.Q.value=.8;g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.09);s.connect(f);f.connect(g);g.connect(a.destination);s.start(t,Math.random()*1.5,.1)}
  }else if(k==="party"){[523,659,784,1047,1319].forEach(function(f,i){tone(f,i*.11,.5,.18,"triangle")});tone(1568,.6,.8,.15,"triangle")}
  else if(k==="balloon"){for(var j=0;j<5;j++)tone(300+Math.random()*500,j*.12,.08,.25,"square")}
  else if(k==="star"){[1047,1319,1568,2093].forEach(function(f,i){tone(f,i*.09,.4,.12)})}
  else if(k==="pop"){tone(700,0,.1,.18);tone(1000,.06,.12,.15)}
  else if(k==="shot"){tone(1800,0,.05,.12,"square");tone(1200,.06,.08,.1,"square")}
  else if(k==="chip"){tone(784,0,.2,.15,"triangle");tone(1175,.1,.35,.15,"triangle")}
}
$("#snd").onclick=function(){S.snd=!S.snd;sndLbl();if(S.snd)sfx("pop");save(true)};
function sndLbl(){$("#snd").textContent=S.snd?"🔊 الصوت يعمل":"🔇 الصوت متوقف"}

/* ---------- celebrations ---------- */
var fx=$("#fx"),fc=fx.getContext("2d"),P=[],raf=0,CC=["#ef4444","#f59e0b","#eab308","#22c55e","#06b6d4","#3b82f6","#a855f7","#ec4899"];
function confetti(n){
  fx.width=innerWidth;fx.height=innerHeight;
  for(var i=0;i<n;i++)P.push({x:innerWidth*(.25+Math.random()*.5),y:innerHeight*.65,vx:(Math.random()-.5)*20,vy:-Math.random()*20-6,s:6+Math.random()*8,c:CC[i%CC.length],r:Math.random()*6,vr:(Math.random()-.5)*.4});
  if(!raf)raf=requestAnimationFrame(loop);
}
function loop(){
  fc.clearRect(0,0,fx.width,fx.height);
  P=P.filter(function(p){return p.y<fx.height+30});
  P.forEach(function(p){p.vy+=.38;p.x+=p.vx;p.y+=p.vy;p.vx*=.985;p.r+=p.vr;fc.save();fc.translate(p.x,p.y);fc.rotate(p.r);fc.fillStyle=p.c;fc.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);fc.restore()});
  raf=P.length?requestAnimationFrame(loop):0;
}
function floaters(e,n,dir){
  for(var i=0;i<n;i++){var s=document.createElement("span");s.className="fl "+dir;s.textContent=e;s.style.left=Math.random()*94+"vw";s.style.fontSize=(30+Math.random()*34)+"px";s.style.animationDelay=Math.random()*1.2+"s";s.style.animationDuration=(3+Math.random()*2.2)+"s";document.body.appendChild(s);(function(x){setTimeout(function(){x.remove()},7000)})(s)}
}
var PH=["ممتاز يا بطل! 🌟","أحسنت! 👏","رائع جدًا! ✨","مبدع! 🎨","شاطرة يا شاطرة! 💜","ما شاء الله عليكِ! 🌸","إجابة صحيحة ✅","استمري يا نجمة ⭐","تفكير ذكي 💡"];
var ban=$("#ban"),bt;
function banner(m){ban.textContent=m;ban.classList.remove("show");void ban.offsetWidth;ban.classList.add("show");clearTimeout(bt);bt=setTimeout(function(){ban.classList.remove("show")},2300)}
function rnd(){return PH[Math.floor(Math.random()*PH.length)]}
function fxRun(k){
  sfx(k);
  if(k==="clap"){floaters("👏",16,"up");banner("تصفيق حار! 👏")}
  else if(k==="party"){confetti(240);banner("مبروك! 🎉")}
  else if(k==="balloon"){floaters("🎈",22,"up");banner(rnd())}
  else if(k==="star"){floaters("⭐",24,"dn");banner(rnd())}
}
[].forEach.call(document.querySelectorAll("[data-fx]"),function(b){b.onclick=function(){fxRun(b.dataset.fx)}});
PH.forEach(function(p){var c=document.createElement("button");c.className="chip";c.textContent=p;c.onclick=function(){banner(p);confetti(110);sfx("chip")};$("#chips").appendChild(c)});
$("#fxb").onclick=function(e){e.stopPropagation();ac();$("#pop").classList.toggle("show")};
document.addEventListener("pointerdown",function(e){if(!e.target.closest("#pop,#fxb"))$("#pop").classList.remove("show");if(!e.target.closest("#emo,#tl"))$("#emo").classList.remove("show")});

/* ---------- misc ---------- */
var tt;function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("show")},2200)}
function fit(){var r=$("#wrap").getBoundingClientRect(),w=r.width-16,h=Math.min(r.height-16,w*9/16);if(h<50)h=50;stage.style.height=h+"px";stage.style.width=(h*16/9)+"px"}
window.addEventListener("resize",fit);
document.addEventListener("keydown",function(e){
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;
  var k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==="z"){e.preventDefault();e.shiftKey?redo():undo();return}
  if((e.ctrlKey||e.metaKey)&&k==="y"){e.preventDefault();redo();return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var m={p:"pen",h:"hl",e:"erase",l:"line",a:"arrow",r:"rect",o:"ell",t:"text",k:"laser"};
  if(m[k]){e.preventDefault();setTool(m[k])}
});
function initUI(){
  $("#sz").value=S.size;$("#op").value=Math.round(S.alpha*100);
  if(S.theme)document.documentElement.dataset.theme=S.theme;
  var t0=S.tool;sndLbl();setColor(S.color);setTool(t0);
}
try{var raw=localStorage.getItem(KEY);if(raw)apply(JSON.parse(raw))}catch(e){}
initUI();fit();refresh();stat("ok");
requestAnimationFrame(fit);
})();
</script>
