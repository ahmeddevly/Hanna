<style>
  :root{--b1:#fbe7ff;--b2:#d6f0ff;--bb:#fff8ee;--pn:rgba(255,255,255,.84);--tx:#2b2250;--mt:#7a74a3;--ac:#8b5cf6;--ac2:#ec4899;--ac3:#f59e0b;--bd:rgba(139,92,246,.22);--sh:0 10px 34px rgba(92,60,180,.22);color-scheme:light}

*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Baloo Bhaijaan 2",Cairo,Fredoka,Tahoma,"Segoe UI",sans-serif;color:var(--tx);user-select:none;-webkit-user-select:none;
 background:radial-gradient(circle at 12% 8%,var(--b1),transparent 55%),radial-gradient(circle at 92% 92%,var(--b2),transparent 55%),var(--bb);
 display:grid;grid-template:"top top" auto "rail main" minmax(0,1fr) "dock dock" auto/auto minmax(0,1fr);
 padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.glass{background:var(--pn);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);box-shadow:var(--sh)}

.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px}
.logo{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;color:#fff;font-size:21px;background:linear-gradient(135deg,var(--ac),var(--ac2) 60%,var(--ac3));box-shadow:0 5px 16px rgba(139,92,246,.5);animation:wob 4s ease-in-out infinite}

#boards{display:flex;gap:6px;overflow-x:auto}
.bt{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:16px;font-weight:800;font-size:14px;white-space:nowrap;background:var(--bd);transition:.2s}
.bt.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 6px 18px rgba(236,72,153,.4)}
.bt.lock{opacity:.6}.bt small{font-size:11px}
.sp{flex:1}
#st{font-size:12px;color:var(--mt);padding:3px 10px;border-radius:99px;border:1px solid var(--bd)}
#st.ok{color:#16a34a}#st.err{color:#dc2626}
.pill{display:flex;border-radius:99px;background:var(--bd);padding:3px}
.pill span{padding:6px 13px;border-radius:99px;font-weight:800;font-size:14px;color:var(--mt)}
.pill span.on{background:var(--ac);color:#fff}
.ib{width:46px;height:46px;border-radius:16px;font-size:22px;background:var(--bd);transition:.15s}
.ib:hover{transform:translateY(-2px)}
#rail{grid-area:rail;display:flex;flex-direction:column;gap:8px;padding:10px 4px 10px 10px;overflow-y:auto;scrollbar-width:none}
.rb{width:66px;min-height:66px;flex:none;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:26px;background:var(--pn);border:1px solid var(--bd);box-shadow:0 4px 14px rgba(92,60,180,.14);transition:.18s}
.rb small{font-size:11px;font-weight:800;color:var(--mt)}
.rb:hover{transform:scale(1.05)}
.rb.on{background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 8px 22px rgba(236,72,153,.45)}
.rb.on small{color:#fff}
#main{grid-area:main;position:relative;min-width:0;min-height:0}
#vp{position:absolute;inset:0;overflow:hidden;touch-action:none}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;border-radius:18px;overflow:hidden;box-shadow:0 16px 50px rgba(60,30,140,.3),0 0 0 6px var(--pn);background:#fff;will-change:transform}
#stage canvas{position:absolute;inset:0;width:100%;height:100%}
#dr{touch-action:none;cursor:crosshair}
.ti{position:absolute;z-index:5;background:rgba(255,255,255,.9);border:2px dashed var(--ac);border-radius:8px;outline:0;min-width:160px;padding:0 8px;color:#111;user-select:text;-webkit-user-select:text}
#sheet{display:none;position:absolute;inset-block-end:10px;inset-inline-start:10px;width:min(460px,calc(100% - 20px));max-height:min(62%,460px);overflow:auto;z-index:20;padding:14px;border-radius:26px;background:var(--pn);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--bd);box-shadow:var(--sh)}
#sheet.show{display:block;animation:up .25s ease}
@keyframes up{from{transform:translateY(20px);opacity:0}}
#sheet h4{font-size:13px;color:var(--mt);margin:4px 2px 8px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-bottom:10px}
.it{min-height:78px;border-radius:20px;background:var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:30px;padding:6px;transition:.15s}
.it small{font-size:12px;font-weight:800;text-align:center;line-height:1.1}
.it:hover{transform:translateY(-2px)}
.it.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.sw2{width:100%;height:44px;border-radius:14px;border:3px solid var(--bd)}
.sg.l{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}
.lt{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:34px;font-weight:800;line-height:1;text-shadow:0 2px 5px rgba(0,0,0,.3);box-shadow:inset 0 -6px 0 rgba(0,0,0,.14),0 5px 12px rgba(0,0,0,.18);transition:.15s}
.lt small{font-size:18px;margin-top:3px;text-shadow:none}
.lt:hover{transform:scale(1.1) rotate(-4deg)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.chip{padding:9px 14px;border-radius:99px;background:var(--bd);font-weight:800;font-size:14px}
.chip:hover{background:var(--ac);color:#fff}
#dock{grid-area:dock;display:flex;align-items:center;gap:10px;margin:0 10px 8px;padding:8px 12px;border-radius:24px;flex-wrap:wrap;justify-content:center;background:var(--pn);backdrop-filter:blur(14px);border:1px solid var(--bd);box-shadow:var(--sh)}
.cs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.cd{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);transition:.15s}
.cd.on{transform:scale(1.28);outline:3px solid var(--ac);outline-offset:2px}
#cc{width:38px;height:38px;border:0;padding:0;border-radius:50%;background:none;cursor:pointer}
.szw{display:flex;align-items:center;gap:8px}
#szp{display:block;border-radius:50%;flex:none;min-width:6px;min-height:6px;box-shadow:0 0 0 2px var(--bd)}
.szw .box{width:50px;height:50px;display:grid;place-items:center}
input[type=range]{width:110px;accent-color:var(--ac);height:30px}
.gp{display:flex;align-items:center;gap:5px;padding:4px;border-radius:18px;background:var(--bd);font-weight:800;font-size:14px}
.gp button{width:42px;height:42px;border-radius:14px;font-size:19px;background:var(--pn)}
.gp button:disabled{opacity:.35}
.gp span{min-width:48px;text-align:center}
#exitf{display:none;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));inset-inline-end:10px;z-index:60;width:50px;height:50px;border-radius:50%;font-size:22px;background:var(--pn);border:1px solid var(--bd);box-shadow:var(--sh);opacity:.55}
body.focus{grid-template:"main" 1fr/1fr}
body.focus #top,body.focus #rail,body.focus #dock,body.focus #sheet{display:none}
body.focus #exitf{display:block}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
#ban{position:fixed;top:36%;left:50%;transform:translate(-50%,-50%) scale(0);z-index:80;pointer-events:none;font-size:clamp(26px,7vw,66px);font-weight:800;color:#fff;padding:14px 34px;border-radius:30px;background:linear-gradient(135deg,#8b5cf6,#ec4899,#f59e0b);box-shadow:0 20px 60px rgba(139,92,246,.6);text-align:center;max-width:94vw}

@keyframes pop{0%{transform:translate(-50%,-50%) scale(0) rotate(-8deg)}14%{transform:translate(-50%,-50%) scale(1.15) rotate(3deg)}24%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.8)}}

.fl.up{bottom:-80px;animation:fup linear forwards}.fl.dn{top:-80px;animation:fdn linear forwards}

@keyframes fdn{to{transform:translateY(125vh) rotate(360deg)}}

@keyframes rk{from{transform:translate(-10vw,10vh)}to{transform:translate(112vw,-118vh)}}
.rb2{position:fixed;left:50%;bottom:-2vh;width:min(120vw,170vh);aspect-ratio:2/1;transform:translateX(-50%);z-index:55;pointer-events:none;border-radius:999px 999px 0 0;
 background:radial-gradient(circle at 50% 100%,transparent 0 52%,#ef4444 52% 57%,#f97316 57% 62%,#facc15 62% 67%,#22c55e 67% 72%,#3b82f6 72% 77%,#8b5cf6 77% 82%,transparent 82%);animation:rbw 3.2s ease forwards}
@keyframes rbw{0%{opacity:0;clip-path:inset(0 50% 0 50%)}30%{opacity:1;clip-path:inset(0 0 0 0)}80%{opacity:1}100%{opacity:0}}
#toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:#2b2250;color:#fff;padding:10px 20px;border-radius:99px;font-size:15px;z-index:90;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;text-align:center}
#toast.show{opacity:1}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:95}
#flash.go{animation:fl .4s ease}
@keyframes fl{from{opacity:.9}}
@media (pointer:coarse){.cd{width:42px;height:42px}.rb{width:70px}}
@media (max-width:860px){
 body{grid-template:"top" auto "main" minmax(0,1fr) "rail" auto "dock" auto/minmax(0,1fr)}

 #dock{gap:6px;padding:6px 8px}
 .brand span:last-child{display:none}

}

    case"theme":var dk=document.documentElement.dataset.theme?document.documentElement.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;S.theme=dk?"light":"dark";document.documentElement.dataset.theme=S.theme;save(true);break;
    case"fs":try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(x){}break;
    case"shot":shot();break;case"savef":saveFile();break;case"open":$("#file").click();break;
    case"focus":S.focus=!S.focus;document.body.classList.toggle("focus",S.focus);setTimeout(fitView,60);break;
  }
});
document.addEventListener("input",function(e){
  if(e.target.id==="sz"){S.size=+e.target.value;szp();save(true)}
  if(e.target.id==="cc"){S.color=e.target.value;szp();[].forEach.call(document.querySelectorAll(".cd"),function(x){x.classList.remove("on")});if(S.tool==="erase"||S.tool==="hand"||S.tool==="stamp")S.tool=S.pen;save(true)}
});
function pick(v){
  var a=v.split(":"),n=+a[1],s;
  if(a[0]==="b"){var q=STK[S.lang][n];s={k:"badge",e:q[0],s:q[1],c:BC[n%BC.length]}}
  else if(a[0]==="e"){s={k:"emo",e:EMO[n]}}
  else{var l=LET[S.lang][n];s={k:"letter",l:l[0],s:l[1],e:l[2],c:LC[n%8],say:l[0].replace("ـ","")+", "+l[1]}}
  S.stamp=s;S.tool="stamp";S.sheet="";dc.style.cursor="copy";ui();toast(L("tip"));
}

/* ===== storage ===== */
var stT,KEYS=["lang","cur","tool","pen","shape","color","size","fill","snd","theme"];
function stat(k){var e=$("#st");if(!e)return;e.className=k;e.textContent=k==="ok"?L("ok"):k==="err"?L("er"):L("sv")}
function pack(){var o={v:2,pages:S.pages.map(function(p){return{s:p.s,bg:p.bg}})};KEYS.forEach(function(k){o[k]=S[k]});if(o.tool==="stamp")o.tool=S.pen;return o}
function flush(){try{localStorage.setItem(KEY,JSON.stringify(pack()));stat("ok")}catch(e){stat("err")}}
function save(q){stat("sv");clearTimeout(stT);stT=setTimeout(flush,q?150:350)}
function apply(d){
  if(!d||!Array.isArray(d.pages)||!d.pages.length)return false;
  S.pages=d.pages.map(function(p){return{s:Array.isArray(p.s)?p.s:[],r:[],bg:BGC[p.bg]?p.bg:"white"}});
  S.cur=Math.min(Math.max(+d.cur||0,0),S.pages.length-1);
  if(d.lang==="ar"||d.lang==="en")S.lang=d.lang;
  if(typeof d.color==="string"&&/^#[0-9a-f]{6}$/i.test(d.color))S.color=d.color;
  S.size=Math.min(48,Math.max(2,+d.size||8));S.fill=!!d.fill;S.snd=d.snd!==false;S.theme=d.theme==="dark"||d.theme==="light"?d.theme:"";
  if(isPen(d.pen))S.pen=d.pen;if(isShape(d.shape))S.shape=d.shape;
  S.tool=(isPen(d.tool)||isShape(d.tool)||d.tool==="hand"||d.tool==="erase"||d.tool==="text")?d.tool:S.pen;
  return true;
}
window.addEventListener("pagehide",flush);
document.addEventListener("visibilitychange",function(){if(document.hidden)flush()});

/* ===== export ===== */
function stamp(){var d=new Date(),z=function(n){return(n<10?"0":"")+n};return d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+"-"+z(d.getHours())+z(d.getMinutes())+z(d.getSeconds())}
function deliver(blob,name){
  var f;try{f=new File([blob],name,{type:blob.type})}catch(e){}
  if(f&&navigator.canShare&&navigator.canShare({files:[f]})&&/Android|iPhone|iPad|Mobi/i.test(navigator.userAgent)){navigator.share({files:[f]}).catch(function(){});return}
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},5000);
}
function shot(){
  var fl=$("#flash");fl.classList.remove("go");void fl.offsetWidth;fl.classList.add("go");sfx("shot");
  var c=document.createElement("canvas");c.width=W;c.height=H;var x=c.getContext("2d");x.drawImage(bgc,0,0);x.drawImage(dc,0,0);
  c.toBlob(function(b){if(!b){toast("⚠");return}
    try{if(navigator.clipboard&&window.ClipboardItem)navigator.clipboard.write([new ClipboardItem({"image/png":b})]).catch(function(){})}catch(e){}
    deliver(b,"Hanna-"+stamp()+".png");toast(L("shot"));
  },"image/png");
}
function saveFile(){deliver(new Blob([JSON.stringify(pack())],{type:"application/json"}),"Hanna-board-"+stamp()+".json")}
$("#file").onchange=function(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{if(!apply(JSON.parse(r.result)))throw 0;S.sheet="";ui();refresh();save(true);toast(L("opened"))}catch(x){toast(L("bad"))}};
  r.readAsText(f);e.target.value="";
};

/* ===== sound ===== */
var AC,NB;
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}return S.snd?AC:null}
function tone(f,t,d,v,ty,f2){var a=ac();if(!a)return;var o=a.createOscillator(),g=a.createGain(),n=a.currentTime+t;o.type=ty||"sine";o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(.0001,n);g.gain.linearRampToValueAtTime(v||.2,n+.02);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(a.destination);o.start(n);o.stop(n+d+.05)}
function noise(t,d,fq,v){var a=ac();if(!a)return;if(!NB){NB=a.createBuffer(1,a.sampleRate*2,a.sampleRate);var x=NB.getChannelData(0);for(var i=0;i<x.length;i++)x[i]=Math.random()*2-1}var s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),n=a.currentTime+t;s.buffer=NB;f.type="bandpass";f.frequency.value=fq;f.Q.value=.8;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);s.connect(f);f.connect(g);g.connect(a.destination);s.start(n,Math.random(),d+.05)}
function sfx(k){
  var i;if(!ac())return;
  if(k==="clap"){for(i=0;i<32;i++)noise(Math.random()*1.8,.09,1200+Math.random()*2600,.4)}
  else if(k==="conf"){[523,659,784,1047,1319].forEach(function(f,n){tone(f,n*.1,.5,.18,"triangle")});noise(0,.2,2500,.5)}
  else if(k==="balloon"){for(i=0;i<5;i++)tone(300+Math.random()*500,i*.12,.09,.22,"square")}
  else if(k==="heart"){[784,988,1175,1568].forEach(function(f,n){tone(f,n*.12,.4,.14,"sine")})}
  else if(k==="boom"){noise(0,.5,300,.5);tone(120,0,.5,.3,"sine",40)}
  else if(k==="rocket"){tone(150,0,1.2,.14,"sawtooth",1100);noise(0,1.2,700,.2)}
  else if(k==="star"){[1047,1319,1568,2093].forEach(function(f,n){tone(f,n*.09,.4,.12)})}
  else if(k==="pop"){tone(700,0,.1,.18);tone(1000,.06,.12,.15)}
  else if(k==="shot"){tone(1800,0,.05,.12,"square");tone(1200,.06,.08,.1,"square")}
  else if(k==="chip"){tone(784,0,.2,.15,"triangle");tone(1175,.1,.35,.15,"triangle")}
}
function say(t){
  if(!S.snd||!window.speechSynthesis)return;
  try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t.replace(/[^\p{L}\p{N}\s!?,.،]/gu,""));u.lang=ar()?"ar-SA":"en-US";u.rate=.85;speechSynthesis.speak(u)}catch(e){}
}

/* ===== celebrations ===== */
var fxc=$("#fx"),fc=fxc.getContext("2d"),P=[],raf=0,CC=["#ef4444","#f59e0b","#eab308","#22c55e","#06b6d4","#3b82f6","#a855f7","#ec4899"];
function fxSize(){fxc.width=innerWidth;fxc.height=innerHeight}
function loop(){
  fc.clearRect(0,0,fxc.width,fxc.height);
  P=P.filter(function(p){return p.l<p.L});
  P.forEach(function(p){
    p.l++;p.vy+=p.g;p.vx*=p.d;p.vy*=p.d;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr||0;
    fc.globalAlpha=Math.min(1,(p.L-p.l)/20);fc.fillStyle=p.c;
    if(p.s){fc.save();fc.translate(p.x,p.y);fc.rotate(p.r);fc.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);fc.restore()}
    else{fc.beginPath();fc.arc(p.x,p.y,p.r,0,6.283);fc.fill()}
  });
  fc.globalAlpha=1;raf=P.length?requestAnimationFrame(loop):0;if(!raf)fc.clearRect(0,0,fxc.width,fxc.height);
}
function go2(){if(!raf)raf=requestAnimationFrame(loop)}
function confetti(n,ox,oy,dir){
  fxSize();ox=ox==null?innerWidth/2:ox;oy=oy==null?innerHeight*.65:oy;dir=dir||0;
  for(var i=0;i<n;i++)P.push({x:ox,y:oy,vx:(Math.random()-.5)*18+dir*8,vy:-Math.random()*20-6,g:.35,d:.99,s:7+Math.random()*9,c:CC[i%CC.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,l:0,L:150+Math.random()*60});
  go2();
}
function burst(x,y){
  var h=Math.random()*360,i,a,s;fxSize();
  for(i=0;i<80;i++){a=6.283*i/80;s=2+Math.random()*6;P.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.06,d:.985,r:2.4,c:"hsl("+(h+Math.random()*50)+",100%,60%)",l:0,L:70+Math.random()*30})}
  go2();
}
function spark(x,y){fxSize();for(var i=0;i<3;i++)P.push({x:x,y:y,vx:(Math.random()-.5)*2,vy:Math.random()*2,g:.02,d:.98,r:3+Math.random()*3,c:i%2?"#f97316":"#facc15",l:0,L:30});go2()}
function floaters(arr,n,dir){
  for(var i=0;i<n;i++){var s=document.createElement("span");s.className="fl "+dir;s.textContent=arr[i%arr.length];s.style.left=Math.random()*94+"vw";s.style.fontSize=(34+Math.random()*38)+"px";s.style.setProperty("--sx",(Math.random()*120-60)+"px");s.style.setProperty("--r",(Math.random()*50-25)+"deg");s.style.animationDelay=Math.random()*1.2+"s";s.style.animationDuration=(3+Math.random()*2.2)+"s";document.body.appendChild(s);(function(x){setTimeout(function(){x.remove()},7500)})(s)}
}
var bT,ban=$("#ban");
function banner(m){ban.textContent=m;ban.classList.remove("show");void ban.offsetWidth;ban.classList.add("show");clearTimeout(bT);bT=setTimeout(function(){ban.classList.remove("show")},2400)}
function rnd(){var a=PH[S.lang];return a[Math.floor(Math.random()*a.length)]}
function fx(k){
  ac();var m=rnd();
  if(k==="clap"){sfx("clap");floaters(["👏"],18,"up")}
  else if(k==="balloon"){sfx("balloon");floaters(["🎈"],24,"up")}
  else if(k==="heart"){sfx("heart");floaters(["💖","💗","💕","❤️","💜"],26,"up")}
  else if(k==="star"){sfx("star");floaters(["⭐","🌟","✨"],26,"dn")}
  else if(k==="conf"){sfx("conf");confetti(130,0,innerHeight,1);confetti(130,innerWidth,innerHeight,-1)}
  else if(k==="fire"){for(var i=0;i<6;i++)setTimeout(function(){burst(innerWidth*(.15+Math.random()*.7),innerHeight*(.15+Math.random()*.35));sfx("boom")},i*380)}
  else if(k==="rocket"){
    sfx("rocket");var r=document.createElement("span");r.className="rk";r.textContent="🚀";document.body.appendChild(r);var t0=Date.now(),iv=setInterval(function(){var b=r.getBoundingClientRect();spark(b.left+b.width/2,b.top+b.height/2);if(Date.now()-t0>2300){clearInterval(iv);r.remove()}},35);
  }else if(k==="rainbow"){sfx("star");var d=document.createElement("div");d.className="rb2";document.body.appendChild(d);setTimeout(function(){d.remove()},3300);floaters(["⭐","✨"],12,"dn")}
  banner(m);say(m);
}

/* ===== misc ===== */
var tT;function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tT);tT=setTimeout(function(){t.classList.remove("show")},2400)}
window.addEventListener("resize",function(){fitView();fxSize()});
document.addEventListener("keydown",function(e){
  if(e.target.tagName==="INPUT")return;var k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==="z"){e.preventDefault();e.shiftKey?redo():undo();return}
  if((e.ctrlKey||e.metaKey)&&k==="y"){e.preventDefault();redo();return}
  if(e.key==="Escape"){if(S.focus){S.focus=false;document.body.classList.remove("focus");setTimeout(fitView,60)}else closeSheetSoft()}
});
document.addEventListener("pointerdown",function(e){if(S.sheet&&!e.target.closest("#sheet,#rail"))closeSheetSoft()});
try{var raw=localStorage.getItem(KEY);if(raw)apply(JSON.parse(raw))}catch(e){}
if(S.theme)document.documentElement.dataset.theme=S.theme;
ui();fitView();fxSize();refresh();stat("ok");dc.style.cursor="crosshair";
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(refresh);
})();
</script>
